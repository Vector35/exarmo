name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Trusted Publishing, which each crate names this workflow and
      # environment for on crates.io.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Every crate not marked publish = false, in dependency order.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Generate release notes from the commit messages since the previous
      # tag. --generate-notes alone is not enough, as it only lists pull
      # requests merged in this repository, and there are none. It still
      # adds the compare link.
      - run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges \
            --format="- %s ([%h](https://github.com/$GITHUB_REPOSITORY/commit/%H))" \
            ${prev:+"$prev.."}"$GITHUB_REF_NAME" | sed '/^- Release v/d' > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
