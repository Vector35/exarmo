[package]
name = "exarmo-aarch64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AArch64 disassembler generated from Arm's machine-readable ISA specification"
license.workspace = true
repository.workspace = true
keywords = ["arm", "aarch64", "arm64", "disassembler", "decoder"]
categories = ["development-tools"]
documentation = "https://docs.rs/exarmo-aarch64"
# The tests read the corpus through exarmo-testing, which is not published.
exclude = ["tests/"]

[dependencies]
exarmo-core.workspace = true

[dev-dependencies]
exarmo-testing = { path = "../testing" }
insta.workspace = true
